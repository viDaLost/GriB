name: Train model

on:
  workflow_dispatch:
    inputs:
      per_species:
        description: Фото на вид
        default: '600'
      photos_per_obs:
        description: Фото с одного наблюдения (1 — больше разных грибов)
        default: '1'
      danger_weight:
        description: Вес ядовитых видов при обучении
        default: '2.0'
      epochs_head:
        description: Эпох обучения классификатора
        default: '4'
      epochs_finetune:
        description: Эпох дообучения
        default: '16'
      finetune_layers:
        description: Сколько верхних слоёв дообучать (0 — все)
        default: '0'

permissions:
  contents: write
  actions: write

concurrency:
  group: train
  cancel-in-progress: false

# Обучение на CPU длинное, а задача GitHub Actions живёт не больше 6 часов.
# Поэтому до 4 этапов подряд; каждый продолжает с места остановки предыдущего.
jobs:
  stage1:
    uses: ./.github/workflows/train-stage.yml
    with:
      stage: 1
      per_species: ${{ inputs.per_species }}
      photos_per_obs: ${{ inputs.photos_per_obs }}
      danger_weight: ${{ inputs.danger_weight }}
      epochs_head: ${{ inputs.epochs_head }}
      epochs_finetune: ${{ inputs.epochs_finetune }}
      finetune_layers: ${{ inputs.finetune_layers }}

  stage2:
    needs: stage1
    if: needs.stage1.outputs.done != 'true'
    uses: ./.github/workflows/train-stage.yml
    with:
      stage: 2
      per_species: ${{ inputs.per_species }}
      photos_per_obs: ${{ inputs.photos_per_obs }}
      danger_weight: ${{ inputs.danger_weight }}
      epochs_head: ${{ inputs.epochs_head }}
      epochs_finetune: ${{ inputs.epochs_finetune }}
      finetune_layers: ${{ inputs.finetune_layers }}

  stage3:
    needs: stage2
    if: needs.stage2.outputs.done != 'true'
    uses: ./.github/workflows/train-stage.yml
    with:
      stage: 3
      per_species: ${{ inputs.per_species }}
      photos_per_obs: ${{ inputs.photos_per_obs }}
      danger_weight: ${{ inputs.danger_weight }}
      epochs_head: ${{ inputs.epochs_head }}
      epochs_finetune: ${{ inputs.epochs_finetune }}
      finetune_layers: ${{ inputs.finetune_layers }}

  stage4:
    needs: stage3
    if: needs.stage3.outputs.done != 'true'
    uses: ./.github/workflows/train-stage.yml
    with:
      stage: 4
      per_species: ${{ inputs.per_species }}
      photos_per_obs: ${{ inputs.photos_per_obs }}
      danger_weight: ${{ inputs.danger_weight }}
      epochs_head: ${{ inputs.epochs_head }}
      epochs_finetune: ${{ inputs.epochs_finetune }}
      finetune_layers: ${{ inputs.finetune_layers }}

  finish:
    needs: [stage1, stage2, stage3, stage4]
    # Пропущенный этап значит, что обучение закончилось раньше; упавший — останавливаемся.
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: training
    env:
      TF_CPP_MIN_LOG_LEVEL: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: training/requirements.txt

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Кеш фото
        uses: actions/cache/restore@v4
        with:
          path: training/data
          key: inat-${{ inputs.per_species }}-${{ inputs.photos_per_obs }}-${{ hashFiles('app/src/data/species/*.json', 'training/download_inat.py') }}
          fail-on-cache-miss: true

      - name: Список фото
        run: python download_inat.py --per-species ${{ inputs.per_species }} --photos-per-obs ${{ inputs.photos_per_obs }} --service-images 2000 --workers 12 2>&1 | grep -v -E '^(Загрузка|Поиск) ' ; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Состояние обучения
        uses: actions/download-artifact@v4
        with:
          name: train-state
          path: training/models

      - name: Калибровка и проверка на отложенных фото
        run: python train.py --finalize-only

      - name: Экспорт модели и фото
        run: |
          python export_tflite.py
          python export_photos.py
          python -c "import json; r=json.load(open('models/report.json')); json.dump(r, open('last-report.json','w'), ensure_ascii=False, indent=2)"

      - uses: actions/upload-artifact@v4
        with:
          name: gribnik-model
          path: |
            training/models/gribnik.keras
            training/models/labels.json
            training/models/report.json
            training/last-report.json

      - name: Коммит модели в репозиторий
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/model app/assets/species app/src/ml/modelAsset.ts app/src/data/speciesPhotos.ts training/last-report.json
          git commit -m "Модель распознавания: обучение #${{ github.run_number }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Пересобрать APK и веб-версию с новой моделью
        working-directory: .
        run: |
          gh workflow run android.yml --ref main
          gh workflow run web.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
