name: Recheck trained model

on:
  push:
    branches: [main]
    paths: [training/recheck-request.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      TF_CPP_MIN_LOG_LEVEL: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: training/requirements.txt
      - name: Проверить номер исходного обучения
        id: request
        run: python training/recheck_config.py --github-output "$GITHUB_OUTPUT"
      - name: Проверить происхождение исходного запуска
        id: source
        env:
          SOURCE_RUN: ${{ steps.request.outputs.source_run }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          python training/recheck_config.py --run-info source-run.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          path: original
      - name: Проверить неизменность каталога и базовой модели
        id: config
        run: python training/recheck_config.py --original original --github-output "$GITHUB_OUTPUT"
      - name: Зависимости и тесты калибровки
        working-directory: training
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Тот же набор фотографий исходного обучения
        uses: actions/cache/restore@v4
        with:
          path: training/data
          key: inat-v3-${{ steps.config.outputs.per_species }}-${{ steps.config.outputs.photos_per_obs }}-${{ steps.config.outputs.service_images }}-${{ hashFiles('original/app/src/data/species/*.json', 'original/training/download_inat.py', 'original/training/data_quality.py', 'original/training/common.py') }}
          fail-on-cache-miss: true
      - name: Получить готовые веса без нового обучения
        env:
          SOURCE_RUN: ${{ steps.request.outputs.source_run }}
        run: |
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" -n gribnik-model -D incoming
          cmp training/data/manifest.csv incoming/data/manifest.csv
          mkdir -p training/models
          cp -a incoming/models/. training/models/
      - name: Настроить уверенность только на валидационных фото
        working-directory: training
        run: python train.py --finalize-only
      - name: Повторить проверку TFLite и всех требований выпуска
        working-directory: training
        run: python export_tflite.py
      - name: Фотографии карточек и итоговый отчёт
        working-directory: training
        run: |
          python export_photos.py
          cp models/report.json last-report.json
      - name: Проверка приложения
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
      - name: Сохранить результаты, включая отклонённого кандидата
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gribnik-model
          retention-days: 90
          path: |
            training/models/gribnik.keras
            training/models/labels.json
            training/models/config.json
            training/models/report.json
            training/models/state.json
            training/models/candidate
            training/models/holdout-predictions.npz
            training/models/validation-predictions.npz
            training/data/dataset-report.json
            training/data/manifest.csv
      - name: Опубликовать модель после успешных проверок
        run: |
          git fetch origin main
          git diff --quiet "$GITHUB_SHA" origin/main -- app/assets/model app/src/data/species
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/model app/assets/species app/src/ml/modelAsset.ts app/src/data/speciesPhotos.ts training/last-report.json
          git commit -m "Модель: проверенная калибровка #${{ github.run_number }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Пересобрать APK и веб-версию
        run: |
          gh workflow run android.yml --ref main
          gh workflow run web.yml --ref main
